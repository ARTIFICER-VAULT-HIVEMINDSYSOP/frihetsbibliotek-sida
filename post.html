<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n-doc="post.docTitle">Katalogpost · Frihetsbibliotek</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0c0b09; --card:#1a1712; --gold:#c9a24a; --gold-soft:#e6d3a3; --ink:#e8e0d0; --mute:#8f8778; --line:#2e2a22; }
    * { box-sizing:border-box; }
    body {
      margin:0; color:var(--ink); font:400 16px/1.5 "Source Sans 3", sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(92,36,48,.2), transparent 45%),
        radial-gradient(ellipse at 80% 0%, rgba(201,162,74,.12), transparent 40%),
        var(--bg);
      padding-bottom:3rem;
    }
    a { color:var(--gold-soft); text-decoration:none; }
    a:hover { text-decoration:underline; }
    nav.top {
      position:sticky; top:0; z-index:2;
      background:rgba(23,21,15,.52);
      backdrop-filter:blur(18px) saturate(1.35);
      -webkit-backdrop-filter:blur(18px) saturate(1.35);
      border-bottom:1px solid rgba(201,162,74,.28);
      box-shadow:0 8px 32px rgba(0,0,0,.38), inset 0 1px 0 rgba(230,211,163,.12);
    }
    nav.top .inner { max-width:52rem; margin:0 auto; padding:.5rem 1rem; display:flex; gap:.5rem 1rem; align-items:center; flex-wrap:wrap; }
    nav.top .brand { font:500 .75rem "IBM Plex Mono", monospace; color:var(--gold); letter-spacing:.04em; }
    nav.top a { font:500 .78rem "IBM Plex Mono", monospace; color:var(--mute); }
    nav.top a:hover { color:var(--gold-soft); text-decoration:none; }
    .lang-switch { margin-left:auto; display:inline-flex; align-items:center; gap:.15rem; font:500 .72rem "IBM Plex Mono", monospace; letter-spacing:.04em; }
    .lang-sep { color:var(--line); user-select:none; padding:0 .05rem; }
    .lang-btn { background:transparent; border:0; color:var(--mute); cursor:pointer; font:inherit; letter-spacing:.06em; padding:.15rem .3rem; border-radius:4px; }
    .lang-btn:hover { color:var(--gold-soft); }
    .lang-btn.is-active { color:var(--gold); box-shadow:inset 0 -1px 0 var(--gold); }
    main { max-width:52rem; margin:0 auto; padding:1.75rem 1rem 0; }
    .back { font:500 .75rem "IBM Plex Mono", monospace; color:var(--mute); }
    h1 { font-family:Fraunces,serif; color:var(--gold-soft); margin:.8rem 0 1rem; font-size:clamp(1.7rem,4vw,2.35rem); line-height:1.1; }
    .panel {
      position:relative; overflow:hidden;
      background:linear-gradient(165deg, rgba(230,211,163,.10), rgba(23,21,15,.42) 38%, rgba(12,11,9,.55));
      border:1px solid rgba(201,162,74,.28);
      border-radius:12px;
      padding:1rem 1.1rem 1.15rem;
      backdrop-filter:blur(16px) saturate(1.25);
      -webkit-backdrop-filter:blur(16px) saturate(1.25);
      box-shadow:inset 0 1px 0 rgba(230,211,163,.22), 0 12px 28px rgba(0,0,0,.32);
    }
    .panel::after {
      content:""; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(115deg, transparent 36%, rgba(230,211,163,.14) 48%, transparent 60%);
      transform:translateX(-130%);
      animation:glass-shine 1.1s ease .15s 1;
    }
    @keyframes glass-shine { from { transform:translateX(-130%); } to { transform:translateX(130%); } }
    @media (prefers-reduced-motion: reduce) { .panel::after { display:none; } }
    .vault { position:relative; margin:0 0 1rem; color:var(--mute); font-size:.9rem; }
    dl { position:relative; margin:0; }
    .row { display:grid; grid-template-columns:7rem minmax(0,1fr); gap:1rem; padding:.8rem 0; border-bottom:1px solid rgba(201,162,74,.16); }
    .row:last-child { border-bottom:0; }
    dt { color:var(--gold); font:500 .72rem "IBM Plex Mono", monospace; text-transform:uppercase; letter-spacing:.05em; }
    dd { margin:0; color:var(--ink); overflow-wrap:anywhere; }
    .missing { color:var(--mute); }
    @media (max-width:520px) { .row { grid-template-columns:1fr; gap:.2rem; } }
  </style>
</head>
<body>
  <nav class="top" data-i18n-aria="nav.aria" aria-label="Navigering">
    <div class="inner">
      <span class="brand" data-i18n="nav.brand">☦ Hospits</span>
      <a href="frihet.html" data-i18n="nav.home">← Frihetsbibliotek</a>
    </div>
  </nav>
  <main>
    <a class="back" href="frihet.html" data-i18n="post.back">← Tillbaka till katalog</a>
    <h1 id="post-title" data-i18n="post.loading">laddar…</h1>
    <div class="panel" id="post-panel" hidden>
      <p class="vault" data-i18n="post.vaultNote">Fullständig text ligger i valvet. Här visas etikett, typ och filväg.</p>
      <dl id="post-fields">
        <div class="row"><dt data-i18n="post.typ">Typ</dt><dd id="post-typ"></dd></div>
        <div class="row"><dt data-i18n="post.fil">Fil</dt><dd id="post-fil"></dd></div>
      </dl>
    </div>
    <p class="missing" id="post-error" hidden data-i18n="post.missing">Posten hittades inte.</p>
  </main>
  <script src="i18n.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || '';
    const title = document.getElementById('post-title');
    const panel = document.getElementById('post-panel');
    const error = document.getElementById('post-error');
    let current = null;
    function paint() {
      if (!current) return;
      title.textContent = current.etikett || current.id || '';
      document.getElementById('post-typ').textContent = window.FrihetI18n ? FrihetI18n.typLabel(current.typ) : (current.typ || 'post');
      document.getElementById('post-fil').textContent = current.fil || '';
      const docTitle = window.FrihetI18n ? FrihetI18n.t('post.docTitle') : 'Frihetsbibliotek';
      document.title = (current.etikett || current.id || 'post') + ' · ' + docTitle;
    }
    fetch('./frihet-katalog.json?t=' + Date.now(), {cache:'no-store'})
      .then(response => { if (!response.ok) throw new Error('catalog'); return response.json(); })
      .then(catalog => {
        const post = Array.isArray(catalog.poster) ? catalog.poster.find(item => String(item.id) === id) : null;
        if (!post) throw new Error('missing');
        current = post;
        panel.hidden = false;
        paint();
      })
      .catch(() => {
        title.textContent = window.FrihetI18n ? FrihetI18n.t('post.missing') : 'Posten hittades inte.';
        error.hidden = false;
      });
    document.addEventListener('frihet-lang', paint);
  </script>
</body>
</html>
