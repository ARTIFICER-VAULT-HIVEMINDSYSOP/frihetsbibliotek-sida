<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n-doc="post.docTitle">Katalogpost · Frihetsbibliotek</title>
  <link rel="icon" href="schema/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="top" data-i18n-aria="nav.aria" aria-label="Navigering">
    <div class="inner">
      <span class="brand" data-i18n="nav.brand">☦ Hospits</span>
      <a href="frihet.html" data-i18n="nav.home">← Frihetsbibliotek</a>
    </div>
  </nav>
  <main class="post">
    <div class="cross-divider on-dark" aria-hidden="true"><svg class="cross-pattee" viewBox="0 0 100 100" focusable="false"><path fill="currentColor" d="M34 4h32l-8 34 38-8v40l-38-8 8 34H34l8-34L4 70V30l38 8z"/></svg></div>
    <a class="back" href="frihet.html" data-i18n="post.back">← Tillbaka till katalog</a>
    <h1 id="post-title" data-i18n="post.loading">laddar…</h1>
    <div class="panel" id="post-panel" hidden>
      <p class="vault" data-i18n="post.vaultNote">Fullständig text ligger i valvet. Här visas etikett, typ och filväg.</p>
      <dl id="post-fields">
        <div class="row"><dt data-i18n="post.typ">Typ</dt><dd id="post-typ"></dd></div>
        <div class="row"><dt data-i18n="post.fil">Fil</dt><dd id="post-fil"></dd></div>
      </dl>
    </div>
    <p class="missing" id="post-error" hidden data-i18n="post.missing">Posten hittades inte.</p>
  </main>
  <script src="i18n.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || '';
    const title = document.getElementById('post-title');
    const panel = document.getElementById('post-panel');
    const error = document.getElementById('post-error');
    let current = null;
    function paint() {
      if (!current) return;
      title.textContent = current.etikett || current.id || '';
      document.getElementById('post-typ').textContent = window.FrihetI18n ? FrihetI18n.typLabel(current.typ) : (current.typ || 'post');
      document.getElementById('post-fil').textContent = current.fil || '';
      const docTitle = window.FrihetI18n ? FrihetI18n.t('post.docTitle') : 'Frihetsbibliotek';
      document.title = (current.etikett || current.id || 'post') + ' · ' + docTitle;
    }
    fetch('./frihet-katalog.json?t=' + Date.now(), {cache:'no-store'})
      .then(response => { if (!response.ok) throw new Error('catalog'); return response.json(); })
      .then(catalog => {
        const post = Array.isArray(catalog.poster) ? catalog.poster.find(item => String(item.id) === id) : null;
        if (!post) throw new Error('missing');
        current = post;
        panel.hidden = false;
        paint();
      })
      .catch(() => {
        title.textContent = window.FrihetI18n ? FrihetI18n.t('post.missing') : 'Posten hittades inte.';
        error.hidden = false;
      });
    document.addEventListener('frihet-lang', paint);
  </script>
</body>
</html>
